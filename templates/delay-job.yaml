apiVersion: batch/v1
kind: Job
metadata:
  name: delay-job
  labels:
    app: delay-job
    {{- include "netclab.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sleep
        image: alpine:3.24.2
        command: ["sh", "-c", "echo 'Delaying deployment...' && sleep 5"]
