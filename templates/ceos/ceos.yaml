{{- $root := . }}

{{- $ceosDefaultMemory := "4Gi" }}
{{- $ceosDefaultCpu := "2000m" }}

{{- $networkTypeMap := include "netclab.networkTypeMap" $root | fromYaml }}

{{- range $i, $node := .Values.topology.nodes }}
{{- $nodeName := .name }}
{{- if eq .type "ceos" }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .name }}
  annotations:
    k8s.v1.cni.cncf.io/networks: {{ include "netclab.nodeNetworks" (dict "node" $node "networkTypeMap" $networkTypeMap "root" $root) }}
  labels:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
spec:
  terminationGracePeriodSeconds: 0
  affinity:
  {{- include "netclab.podAffinity" $root | nindent 4 }}
  containers:
  - name: {{ .name }}
    image: {{ .image | default ($root.Values.ceos).image | required (printf "node %s: cEOS cannot be pulled -- import it, and name it in ceos.image or the node's image" .name) }}
    env:
    - name: INTFTYPE
      value: eth
    - name: ETBA
      value: "1"
    - name: SKIP_ZEROTOUCH_BARRIER_IN_SYSDBINIT
      value: "1"
    - name: CEOS
      value: "1"
    - name: EOS_PLATFORM
      value: ceoslab
    - name: container
      value: docker
    command:
    - /sbin/init
    - systemd.setenv=INTFTYPE=eth
    - systemd.setenv=ETBA=1
    - systemd.setenv=SKIP_ZEROTOUCH_BARRIER_IN_SYSDBINIT=1
    - systemd.setenv=CEOS=1
    - systemd.setenv=EOS_PLATFORM=ceoslab
    - systemd.setenv=container=docker
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
    resources:
      limits:
        memory: {{ default $ceosDefaultMemory .memory }}
        cpu: {{ default $ceosDefaultCpu .cpu }}
    volumeMounts:
    - name: ceos-startup-config
      mountPath: /mnt/flash/startup-config
      subPath: startup-config
      readOnly: true
  volumes:
  - name: ceos-startup-config
    configMap:
      name: ceos-startup-config
      items:
      - key: startup-config
        path: startup-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
  name: {{ .name }}
spec:
  selector:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
  ports:
  - name: restconf
    protocol: TCP
    port: 6020
    targetPort: 6020
  - name: eapi
    protocol: TCP
    port: 443
    targetPort: 443
  - name: ssh
    protocol: TCP
    port: 22
    targetPort: 22
{{- end }}
{{- end }}
