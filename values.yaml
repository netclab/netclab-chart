# cEOS-wide settings. These apply to every cEOS node, because the startup-config
# is one ConfigMap shared by all of them rather than one per node.
ceos:
  # The image of every cEOS node that names none. cEOS cannot be pulled, so there is
  # no default: import the image you downloaded, and name it here.
  # image: ceos:<version>

  # SSL profile backing RESTCONF on port 6020. The default is EOS's own
  # self-signed profile, which the device generates for itself -- so RESTCONF
  # needs nothing generated and nothing ordered. Point this at a profile you
  # configure yourself if you need a certificate that can be verified.
  restconfSslProfile: ARISTA_DEFAULT_SELF_SIGNED_PROFILE

topology:
  default_network:
    name: b0
    subnet: 192.168.0.0/24
    gateway: 192.168.0.254
  networks:
  - name: b1
    type: bridge
  nodes:
  - name: srl01
    type: srlinux
    memory: 2Gi
    cpu: 500m
    interfaces:
    - name: e1-1
      network: b1
